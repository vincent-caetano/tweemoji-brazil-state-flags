<title id="br-sc-title">Santa Catarina state flag</title>
<desc id="br-sc-desc">Stylized Brazilian federative-unit flag. Crest retains white star, brown eagle, liberty cap, white shield, crossed gold key and anchor, coffee and wheat; inscriptions omitted.</desc>
